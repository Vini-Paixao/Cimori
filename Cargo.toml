[workspace]
resolver = "2"
members = [
    ".",
    "crates/isle-core",
    "crates/isle-render",
    "crates/isle-platform-win",
    "crates/isle-ai",
]

[workspace.package]
version = "1.0.1"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Marcus Paixão"]

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "net", "process", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tiny-skia = "0.11"
ab_glyph = "0.2"
# Required by windows::core::implement for CoreAudio COM callbacks (already transitive).
windows-core = "0.58"

[workspace.dependencies.windows]
version = "0.58"
features = [
    "Foundation",
    "implement",
    "Devices_Radios",
    "Win32_NetworkManagement_WiFi",
    "Win32_NetworkManagement_Ndis",
    "Win32_System_Registry",
    "Win32_UI_Shell_PropertiesSystem",
    "Foundation_Collections",
    "Foundation_Numerics",
    "Media_Control",
    "Storage_Streams",
    "Win32_Graphics_Imaging",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_WinRT",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Graphics_Dwm",
    "Graphics_Effects",
    "UI_Composition_Desktop",
    "UI_ViewManagement",
    "System",
    "Win32_System_WinRT_Composition",
    "Win32_System_WinRT_Graphics_Direct2D",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Storage_FileSystem",
    "Win32_UI_Accessibility",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_SystemServices",
    "Win32_System_WindowsProgramming",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
    "Win32_System_RemoteDesktop",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Networking_BackgroundIntelligentTransferService",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Power",
    "Win32_System_Shutdown",
    "Win32_System_SystemInformation",
    "Win32_System_Time",
    "Win32_Globalization",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Notifications",
    "Win32_Storage_Packaging_Appx",
    "Win32_UI_WindowsAndMessaging",
]

[package]
name = "isle-win"
version.workspace = true
edition.workspace = true
license.workspace = true

# The public name: Cimori.exe.
[[bin]]
name = "Cimori"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
isle-core = { path = "crates/isle-core" }
isle-render = { path = "crates/isle-render" }
isle-platform-win = { path = "crates/isle-platform-win" }
isle-ai = { path = "crates/isle-ai" }

[build-dependencies]
embed-resource = "3"

[target.'cfg(windows)'.dependencies]
windows.workspace = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
