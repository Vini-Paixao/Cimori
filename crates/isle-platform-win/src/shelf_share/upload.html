<!-- Port of isle share/page.html: sequential PUT, progress, picking and pagehide. __NAMES__ are
     filled in by http.rs from locales/ (share.*): the title as HTML, the others as JSON strings. -->
<h2>__TITLE__</h2><input id="pick" type="file" multiple><p id="status" role="status"></p>
<script>
const pick=document.getElementById('pick'), status=document.getElementById('status');
pick.addEventListener('click',()=>fetch('api/picking',{method:'POST'}));
pick.addEventListener('change',async()=>{
  pick.disabled=true;
  for(const file of pick.files){
    await new Promise(resolve=>{
      const request=new XMLHttpRequest();
      request.open('PUT','api/upload?name='+encodeURIComponent(file.name));
      request.upload.addEventListener('progress',e=>{status.textContent=file.name+' · '+(e.lengthComputable?Math.floor(e.loaded/e.total*100)+'%':__SENDING__);});
      request.addEventListener('load',()=>{status.textContent=file.name+(request.status===201?' · '+__ON_SHELF__:' · '+__NOT_SENT__+' ('+request.status+')');resolve();});
      request.addEventListener('error',()=>{status.textContent=__CHECK_WIFI__;resolve();});
      request.send(file);
    });
  }
  pick.disabled=false;pick.value='';
});
addEventListener('pagehide',()=>navigator.sendBeacon('api/bye'));
</script>
